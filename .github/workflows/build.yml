name: Build

# 병합 차단: main/dev Ruleset에서 "빌드·테스트"를 필수 상태 검사로 등록한다.
# job 이름 변경 시 Ruleset의 검사 이름도 함께 변경해야 한다.

on:
  # 모든 대상 브랜치의 PR 생성·수정 시 실행한다.
  pull_request:
    types: [opened, synchronize, edited, reopened, ready_for_review]
  # 브랜치 최초 push와 PR 병합을 포함한다.
  push:
    branches: [main, dev]

permissions:
  contents: read

# 같은 PR/브랜치에 변경이 연속으로 올라오면 이전 실행을 취소한다.
concurrency:
  group: build-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 빌드·테스트
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 소스 코드 가져오기
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      # build.gradle의 Java toolchain 버전과 일치시킨다.
      - name: Java 21 설정
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Windows에서 작업해도 Linux 러너에서 Wrapper를 실행할 수 있도록 한다.
      - name: Gradle 실행 권한 설정
        run: chmod +x gradlew

      # build에 컴파일·테스트·패키징이 포함된다.
      - name: 빌드 및 테스트
        run: ./gradlew build --no-daemon --stacktrace

      - name: 실패한 테스트 보고서 보관
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/build/reports/tests/
            **/build/test-results/
          retention-days: 7
          if-no-files-found: ignore
