name: PR Title

# 병합 차단: main/dev Ruleset에서 "PR 제목 검사"를 필수 상태 검사로 등록한다.
# 제목 규칙: https://github.com/GETDDO/getddo-spec/blob/main/01-conventions/pull-request.md
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-title:
    name: PR 제목 검사
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: PR 제목 형식 확인
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r"\[(feat|fix|docs|style|refactor|test|chore|design|comment|rename|remove|!HOTFIX)\] GD-[1-9][0-9]* \S[^\r\n]*"
          if re.fullmatch(pattern, os.environ["PR_TITLE"]) is None:
              print("::error::PR 제목은 [타입] GD-번호 작업 설명 형식이어야 합니다. 예: [feat] GD-51 사용자 조회 구현")
              sys.exit(1)
          print("PR 제목 형식 검사를 통과했습니다.")
          PY
